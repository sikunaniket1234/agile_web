version: '3.8'

services:
  app:
    image: sikunaniket/agile_web_service:latest
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      postgresDb:
        condition: service_healthy
    networks:
      - app_bridge
    env_file:
      - .env

  postgresDb:
    image: postgres:latest
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: agile_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: abcd1234
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agile_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_bridge

volumes:
  postgres_data:

networks:
  app_bridge:
    driver: bridge